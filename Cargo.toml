[package]
name = "rasteron"
version = "0.1.0"
edition = "2024"

[dependencies]
fontdue = { version = "0.9.4", optional = true }

[dev-dependencies]
criterion = { version = "0.7", default-features = false }

[features]
default = ["programmable", "simd", "font_bitmap", "font_truetype"]
programmable = []
simd = []
font_bitmap = []
font_truetype = ["fontdue"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1

[[bench]]
name = "renderer"
harness = false
