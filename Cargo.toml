[package]
name = "rasteron"
version = "0.1.0"
edition = "2024"

[dependencies]
fontdue = { version = "0.9.4", optional = true }

[dev-dependencies]
criterion = { version = "0.7", default-features = false }

[features]
default = ["programmable", "simd", "alloc", "font_bitmap", "font_truetype"]
programmable = []
simd = []
# 允许库内使用堆分配（提供 `draw_char_owned` / `draw_text_owned` 便利方法）。
# 无 alloc 的构建里所有缓冲仍由调用方提供——「库内不做分配」是默认契约，
# 本 feature 只是显式放弃它以换取免 scratch 的便利。
alloc = []
font_bitmap = []
# fontdue 本身是 `no_std` + `alloc` 依赖，故隐含 `alloc`。
font_truetype = ["fontdue", "alloc"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1

# 基准按被测子系统拆成 5 个独立目标，每个都是自己的 criterion 入口。
# 都用 `harness = false`（criterion 自带 main），并按所需 feature 声明
# `required-features`——使 `cargo bench --no-default-features` 直接跳过
# 无法编译的目标，而不是报一堆缺失符号的错。

[[bench]]
name = "pixel_and_buffer"
harness = false

[[bench]]
name = "primitives"
harness = false

[[bench]]
name = "color_and_angle"
harness = false

[[bench]]
name = "programmable_pipeline"
harness = false
required-features = ["programmable"]

[[bench]]
name = "font"
harness = false
# 两个字体 feature 至少开一个，`rasteron::font` 才存在。
required-features = ["font_bitmap"]
